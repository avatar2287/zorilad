name: ZORILAD Android test APK

on:
  push:
    branches:
      - audit/android-test-2026-11-05
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint -- --max-warnings=4
      - name: Build mobile bundle
        run: npm run build:mobile
      - name: Prepare Android project
        run: node scripts/setup-android.mjs
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee ZORILAD-test.sha256
          cp android/app/build/outputs/apk/debug/app-debug.apk ZORILAD-test.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZORILAD-test-apk
          path: |
            ZORILAD-test.apk
            ZORILAD-test.sha256
          if-no-files-found: error
          retention-days: 14
