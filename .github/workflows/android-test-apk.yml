name: ZORILAD Android test APK

on:
  push:
    branches:
      - audit/android-test-2026-11-05
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint -- --max-warnings=4
      - name: Build mobile bundle
        run: npm run build:mobile
      - name: Prepare Android project
        run: node scripts/setup-android.mjs
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee ZORILAD-test.sha256
          cp android/app/build/outputs/apk/debug/app-debug.apk ZORILAD-test.apk
      - name: Publish direct test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="zorilad-test-mobile-fix"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "ZORILAD mobile test APK" --notes "Debug-signed APK for manual testing. No real payments. Not for Google Play publication."
          gh release upload "$TAG" ZORILAD-test.apk ZORILAD-test.sha256 --clobber
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZORILAD-test-apk
          path: |
            ZORILAD-test.apk
            ZORILAD-test.sha256
          if-no-files-found: error
          retention-days: 14
