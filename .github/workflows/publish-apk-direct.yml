name: Publish direct APK file

on:
  push:
    branches:
      - audit/android-test-2026-11-05
    paths:
      - .github/workflows/publish-apk-direct.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build verified owner APK
        run: |
          npm ci
          npm run typecheck
          npm run lint -- --max-warnings=0
          npm test
          VITE_OWNER_REVIEW=true npm run build:mobile
          node scripts/setup-android.mjs
          cd android
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/ZORILAD.apk
          unzip -t /tmp/ZORILAD.apk
          sha256sum /tmp/ZORILAD.apk > /tmp/ZORILAD.sha256
          cd /tmp && zip -9 ZORILAD.zip ZORILAD.apk && cd -
      - name: Publish direct downloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-download
          git rm -rf .
          cp /tmp/ZORILAD.apk ./ZORILAD.apk
          cp /tmp/ZORILAD.sha256 ./ZORILAD.sha256
          cp /tmp/ZORILAD.zip ./ZORILAD.zip
          printf '# ZORILAD owner APK\n\nLatest owner build with the colorful triple yin-yang launcher icon.\n' > README.md
          git add ZORILAD.apk ZORILAD.sha256 ZORILAD.zip README.md
          git commit -m "Publish latest ZORILAD owner APK"
          git push --force origin HEAD:apk-download
